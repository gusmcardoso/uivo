# Uivo com Docker:
#   cp .env.example .env    # defina AUTH_SECRET (e o Telegram, se quiser alertas)
#   docker compose up -d    # http://localhost:3000 → crie a conta no primeiro acesso
#
# Usa a imagem publicada no GHCR; para gerar localmente: docker compose up -d --build
#
# Observabilidade completa (Prometheus, Grafana, Loki, Alloy, node_exporter, cAdvisor):
#   defina METRICS_TOKEN e GRAFANA_ADMIN_PASSWORD no .env e rode
#   docker compose --profile observability up -d    # Grafana em http://localhost:3001

services:
  uivo:
    image: ${UIVO_IMAGE:-ghcr.io/gusmcardoso/uivo}:${UIVO_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${UIVO_PORT:-3000}:3000"
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET no .env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STATUS_PAGE_TITLE: ${STATUS_PAGE_TITLE:-}
      REPORT_AUTHOR: ${REPORT_AUTHOR:-}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - uivo-data:/data

  # ─── Perfil "observability" ─────────────────────────────────────────────────
  # Só o Grafana é publicado, e apenas em 127.0.0.1 (use um proxy reverso com HTTPS
  # para acesso externo). Prometheus e Loki ficam na rede interna do compose.

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - uivo_metrics_token
    depends_on: [uivo]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [observability]
    restart: unless-stopped
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # cAdvisor precisa de modo privilegiado para ler as métricas dos containers (limitação da ferramenta)
  # e do namespace de cgroup do host: com cgroup v2, o namespace privado esconde os outros containers.
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.1
    profiles: [observability]
    restart: unless-stopped
    privileged: true
    cgroup: host
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
    # Sem montar /sys: privilegiado e com cgroup do host, o /sys do próprio container já mostra
    # a árvore real de cgroups. Montar /sys quebra no Docker Desktop (aponta para a distro WSL).
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/lib/docker/:/var/lib/docker:ro

  loki:
    image: grafana/loki:3.5.3
    profiles: [observability]
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  # Alloy lê os logs pelo socket do Docker (somente leitura de logs; o socket em si dá acesso amplo à API).
  alloy:
    image: grafana/alloy:v1.10.0
    profiles: [observability]
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on: [loki]

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/uivo-sites.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on: [prometheus, loki]

# Segredos lidos do ambiente (.env): não ficam em arquivo dentro do repositório.
secrets:
  uivo_metrics_token:
    environment: METRICS_TOKEN
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

volumes:
  uivo-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

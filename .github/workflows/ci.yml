name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ───────────────────────── 1. Qualidade ─────────────────────────
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint e formatação (Biome)
        run: npx biome ci .
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build do painel
        run: npm run build

  # ─────────────── 2. Docker: sobe a imagem e testa de ponta a ponta ───────────────
  docker:
    name: Docker (teste de fumaça)
    needs: quality
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-secret-only-for-tests-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Build e subida
        run: docker compose up -d --build

      - name: Aguardar ficar saudável
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "Uptrue não ficou saudável"; exit 1

      - name: Teste de fumaça
        run: |
          set -euxo pipefail
          B=http://127.0.0.1:3000
          # painel servido
          curl -fsS $B/ | grep -q '<div id="root">'
          # API protegida
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/sites)" = "401"
          # primeiro acesso cria o admin e abre sessão
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' $B/api/setup
          # monitora o próprio Uptrue e força uma checagem
          id=$(curl -fsS -b jar -H 'content-type: application/json' \
            -d '{"name":"Uptrue","url":"http://127.0.0.1:3000/healthz","interval_sec":30,"check_domain":false}' \
            $B/api/sites | jq -r .id)
          status=$(curl -fsS -b jar -X POST -H 'content-type: application/json' -d '{}' $B/api/sites/$id/check | jq -r .status)
          test "$status" = "up"
          # container sem root
          test "$(docker compose exec -T uptrue id -u)" != "0"

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar
        if: always()
        run: docker compose down -v

  # ─────────────── 3. Publicar imagem multi-arquitetura no GHCR ───────────────
  publish:
    name: Publicar imagem (GHCR, amd64 + arm64)
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

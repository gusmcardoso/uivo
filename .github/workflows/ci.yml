name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ───────────────────────── 1. Qualidade ─────────────────────────
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint e formatação (Biome)
        run: npx biome ci .
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: ShellCheck (scripts)
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 --severity=warning scripts/*.sh
      - name: Build do painel
        run: npm run build

  # ─────────────── 2. Docker: sobe a imagem e testa de ponta a ponta ───────────────
  docker:
    name: Docker (teste de fumaça)
    needs: quality
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-secret-only-for-tests-0123456789
      METRICS_TOKEN: ci-metrics-token-0123456789
    steps:
      - uses: actions/checkout@v7

      - name: Build e subida
        run: docker compose up -d --build

      - name: Aguardar ficar saudável
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/healthz; then echo; exit 0; fi
            sleep 2
          done
          echo "Uptrue não ficou saudável"; exit 1

      - name: Teste de fumaça
        run: |
          set -euxo pipefail
          B=http://127.0.0.1:3000
          # painel servido
          # (saída guardada antes do grep: com pipefail, grep -q fechando o cano cedo derruba o comando anterior)
          page=$(curl -fsS $B/)
          grep -q '<div id="root">' <<< "$page"
          # API protegida
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/api/sites)" = "401"
          # primeiro acesso cria o admin e abre sessão
          curl -fsS -c jar -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-123"}' $B/api/setup
          # monitora o próprio Uptrue e força uma checagem
          id=$(curl -fsS -b jar -H 'content-type: application/json' \
            -d '{"name":"Uptrue","url":"http://127.0.0.1:3000/healthz","interval_sec":30,"check_domain":false}' \
            $B/api/sites | jq -r .id)
          status=$(curl -fsS -b jar -X POST -H 'content-type: application/json' -d '{}' "$B/api/sites/$id/check" | jq -r .status)
          test "$status" = "up"
          # página de status pública: o site marcado como público aparece, sem login
          curl -fsS -b jar -X PATCH -H 'content-type: application/json' -d '{"public":true}' "$B/api/sites/$id" > /dev/null
          curl -fsS $B/api/public/status | jq -e '.sites[0].name == "Uptrue"'
          # /metrics exige token e exporta no formato Prometheus
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/metrics)" = "401"
          metrics=$(curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" $B/metrics)
          grep -q 'uptrue_site_up{site="Uptrue"' <<< "$metrics"
          # auditoria de segurança roda e devolve nota de 0 a 100
          curl -fsS -b jar -X POST -H 'content-type: application/json' -d '{}' "$B/api/sites/$id/security" | jq -e '.score >= 0 and .score <= 100'
          metrics=$(curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" $B/metrics)
          grep -q 'uptrue_security_score{site="Uptrue"' <<< "$metrics"
          # eventos estruturados em JSON no log (prontos para o Loki)
          logs=$(docker compose logs --no-color uptrue)
          grep -q '"event":"security.finding"' <<< "$logs"
          # tempo por etapa: a checagem grava DNS/conexão/espera/download e a API devolve percentis
          curl -fsS -b jar "$B/api/sites/$id/timing?range=24h" | jq -e '.samples >= 1 and .p50 != null and .last.timings.wait >= 0'
          # container sem root
          test "$(docker compose exec -T uptrue id -u)" != "0"

      - name: Logs (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar
        if: always()
        run: docker compose down -v

  # ─────────── 2b. Observabilidade: Prometheus, Grafana, Loki, Alloy, node_exporter, cAdvisor ───────────
  observability:
    name: Observabilidade (pilha completa + cada painel)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validar configurações com as ferramentas oficiais
        run: |
          set -euo pipefail
          echo token > /tmp/token
          docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus:/etc/prometheus:ro"             -v /tmp/token:/run/secrets/uptrue_metrics_token:ro prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/observability/loki:/etc/loki:ro" grafana/loki:3.5.3 -config.file=/etc/loki/loki.yml -verify-config
          docker run --rm -v "$PWD/observability/alloy:/etc/alloy:ro" grafana/alloy:v1.10.0 fmt /etc/alloy/config.alloy > /dev/null
          for f in observability/grafana/dashboards/*.json; do jq -e '.uid and (.panels | length > 0)' "$f" > /dev/null; done
      - name: Subir a pilha e testar cada painel
        run: bash scripts/test-observability.sh

  # ─────────── 2c. Atualização: update.sh como num servidor (atualiza, recusa, faz rollback) ───────────
  update:
    name: Atualização (update.sh com rollback)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Simular servidor e testar o update.sh
        run: bash scripts/test-update.sh
      - name: Backup, restore e cópia externa criptografada
        run: TAG=0.1.7 bash scripts/test-backup-restore.sh

  # ─────────────── 3. Publicar imagem multi-arquitetura no GHCR ───────────────
  publish:
    name: Publicar imagem (GHCR, amd64 + arm64)
    needs: [docker, observability, update]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────── 4. Deploy em produção (só em tags v*, se DEPLOY_ENABLED=true) ───────────────
  deploy:
    name: Deploy (produção)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
